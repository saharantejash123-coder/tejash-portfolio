<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6bff"/>
      <stop offset="0.5" stop-color="#6d4bff"/>
      <stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#6d4bff"/>
      <stop offset="0.6" stop-color="#2b6bff"/>
      <stop offset="1" stop-color="#1747d6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- soft grid -->
  <g stroke="#2b6bff" stroke-opacity="0.06">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>

  <!-- glowing orb -->
  <circle cx="980" cy="315" r="210" fill="url(#orb)" opacity="0.18"/>
  <circle cx="980" cy="315" r="120" fill="url(#orb)"/>
  <circle cx="980" cy="315" r="170" fill="none" stroke="#2b6bff" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="980" cy="315" r="205" fill="none" stroke="#ff7a18" stroke-opacity="0.3" stroke-width="2"/>

  <!-- badge -->
  <rect x="90" y="150" width="250" height="46" rx="23" fill="#ffffff" stroke="#e4e9f4"/>
  <circle cx="116" cy="173" r="6" fill="#2b6bff"/>
  <text x="134" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#2b6bff" letter-spacing="2">WELCOME TO MY DIGITAL WORLD</text>

  <!-- name -->
  <text x="88" y="320" font-family="'Segoe UI',Arial,sans-serif" font-size="104" font-weight="800" fill="#0b1020">Tejash</text>
  <text x="88" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="104" font-weight="800" fill="url(#ink)">Saharan</text>

  <!-- roles -->
  <text x="92" y="500" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="600" fill="#4a5673">Student · Developer · Creator · Dreamer</text>
  <text x="92" y="544" font-family="'Segoe UI',Arial,sans-serif" font-size="24" fill="#8a93ad">Age 14 · Rajasthan, India</text>
</svg>
